[workspace]
resolver = "2"
members = [
    "crates/haetae_core",
    "crates/haetae_verify",
    "crates/haetae_engine",
    "crates/haetae_auth",
    "crates/haetae_cli",
]

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
